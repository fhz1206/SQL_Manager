name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 flake8

      - name: Lint with flake8
        run: |
          # 语法错误或未定义变量直接失败
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # 其余风格问题仅警告
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Import smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'EOF'
          import os
          os.environ.setdefault('QT_QPA_PLATFORM', 'offscreen')
          from PyQt6.QtWidgets import QApplication
          import main_window, components, dialogs, custom_dialogs, db_connect_dialog, config, version
          app = QApplication([])
          win = main_window.DBManager()
          win.show()
          print('Smoke test OK, version:', version.VERSION)
          app.quit()
          EOF
