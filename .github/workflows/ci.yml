name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          # 语法错误或未定义变量直接失败
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # 其余风格问题仅警告
          flake8 src tests --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Import smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd src
          python - <<'EOF'
          import os
          os.environ.setdefault('QT_QPA_PLATFORM', 'offscreen')
          from PyQt6.QtWidgets import QApplication
          from sql_manager.ui import main_window, components, dialogs, custom_dialogs, db_connect_dialog
          from sql_manager.core import config, version
          app = QApplication([])
          win = main_window.DBManager()
          win.show()
          print('Smoke test OK, version:', version.VERSION)
          app.quit()
          EOF

      - name: Driver registry test
        run: |
          cd src
          python - <<'EOF'
          from sql_manager.drivers import list_types
          types = list_types()
          assert len(types) >= 26, f'驱动注册数量不足: {len(types)}'
          print('Driver types OK:', len(types))
          EOF

      - name: API import test
        run: |
          cd src
          python - <<'EOF'
          from sql_manager.api.server import app
          paths = {r.path for r in app.routes}
          required = {
              '/api/v1/connect', '/api/v1/disconnect', '/api/v1/nodes',
              '/api/v1/sql/execute', '/api/v1/sql/execute/balanced',
              '/api/v1/slowsql/stats', '/api/v1/groups', '/api/v1/shards',
              '/api/v1/sync', '/api/v1/rebalance',
          }
          missing = required - paths
          assert not missing, f'缺少端点: {missing}'
          print('API routes OK:', len(paths))
          EOF
